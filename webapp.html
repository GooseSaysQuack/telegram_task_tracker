<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f3f3fa; --surface: #ffffff; --surface-2: #f4f3fd; --text: #17162e; --muted: #7b7a99; --line: #e9e8f4;
    --accent: #6c5ce7; --accent-soft: #efedff; --on-accent: #ffffff; --danger: #e5484d; --danger-soft: #fdeeee;
    --hero-from: #5b4bdb; --hero-to: #9a7bff; --shadow: 0 8px 28px rgba(52, 40, 160, .08);
    --c-work: #3b6cf6; --c-personal: #10a37f; --c-shopping: #e08a00; --c-health: #e5484d; --c-study: #8b5cf6; --c-other: #868e96;
    --r-xl: 28px; --r-lg: 20px; --r-md: 14px;
  }
  [data-theme=dark] {
    --bg: #0e0d1a; --surface: #191829; --surface-2: #222138; --text: #f2f1fb; --muted: #8e8cad; --line: #2b2a45;
    --accent: #8f80ff; --accent-soft: #2a2654; --danger: #ff6b6f; --danger-soft: #3a1d26;
    --hero-from: #3e30b8; --hero-to: #6d55e8; --shadow: none;
    --c-work: #6b8cff; --c-personal: #3ccf9f; --c-shopping: #ffb23f; --c-health: #ff6b6f; --c-study: #a98bff; --c-other: #a0a6ad;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; padding-bottom: calc(32px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--text);
         font: 500 15px/1.4 Manrope, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ── Шапка с календарём ── */
  .hero { padding: 14px 16px 18px; border-radius: 0 0 var(--r-xl) var(--r-xl); color: #fff;
          background: linear-gradient(150deg, var(--hero-from), var(--hero-to)); }
  .hero-top, .hero-month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .eyebrow { font-size: 13px; font-weight: 600; opacity: .75; }
  .hero-month { margin: 6px 0 14px; }
  .hero-month h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .hero-month h1 span { font-weight: 500; opacity: .6; }
  .nav { display: flex; gap: 6px; }
  .hbtn { display: grid; place-items: center; height: 34px; min-width: 34px; padding: 0 10px; border-radius: 12px;
          background: rgba(255, 255, 255, .16); color: #fff; font-size: 13px; font-weight: 700; }
  .hbtn:active { background: rgba(255, 255, 255, .28); }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .weekdays { margin-bottom: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: .6; }
  .grid { row-gap: 2px; touch-action: pan-y; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50px; color: #fff; }
  .cell .num { display: grid; place-items: center; width: 36px; height: 36px; margin-bottom: 6px; border-radius: 12px;
               font-size: 15px; font-weight: 700; transition: background .15s, color .15s; }
  .cell.weekend .num { opacity: .75; }
  .cell.out .num { opacity: .35; }
  .cell.today .num { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .75); }
  .cell.sel .num { background: #fff; color: var(--hero-from); opacity: 1; }
  .dots { position: absolute; bottom: 3px; display: flex; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  .dots i.done { opacity: .4; }

  main { padding: 0 16px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 2px 12px; }
  .sec-head > div:first-child { flex: 1 1 210px; min-width: 0; }
  .sec-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .sec-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .head-actions { display: flex; gap: 6px; flex: none; }
  .badge { min-width: 24px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
           font-size: 12px; font-weight: 800; text-align: center; }
  .soft-btn { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 12px; background: var(--accent-soft);
              color: var(--accent); font-weight: 700; white-space: nowrap; }
  .soft-btn svg { width: 16px; height: 16px; stroke-width: 2.5; }
  .stack { display: grid; gap: 10px; }

  /* ── Неделя ── */
  .week { margin-top: 16px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
  .week-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .week-top b { font-size: 15px; font-weight: 800; }
  .week-top span { font-size: 13px; color: var(--muted); }
  .bar { height: 8px; margin: 10px 0; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--hero-from), var(--hero-to)); transition: width .4s; }
  .week-cats { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ── Фильтр категорий ── */
  .filters { display: flex; gap: 6px; margin: -2px -16px 12px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 700; }
  .filter.on { background: var(--text); color: var(--bg); }

  /* ── Карточка задачи ── */
  .card { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
  .when { flex: none; width: 52px; padding-right: 12px; border-right: 3px solid var(--cat, var(--accent)); }
  .when b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .when small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .content { flex: 1; min-width: 0; }
  .content h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .subs { display: grid; gap: 2px; margin-top: 8px; }
  .sub { display: flex; align-items: center; gap: 8px; min-height: 30px; text-align: left; font-size: 14px; overflow-wrap: anywhere; }
  .sub i { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 6px; color: transparent; }
  .sub i svg { width: 12px; height: 12px; stroke-width: 3.5; }
  .sub.done { color: var(--muted); text-decoration: line-through; }
  .sub.done i { border-color: var(--cat, var(--accent)); background: var(--cat, var(--accent)); color: #fff; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 4px 9px; border-radius: 8px;
         background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; }
  .tag svg { width: 13px; height: 13px; }
  .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag.cat { color: var(--cat); background: color-mix(in srgb, var(--cat) 13%, transparent); }
  .tag.hot { color: var(--danger); background: var(--danger-soft); }
  .tag.warn { background: var(--danger-soft); color: var(--danger); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .act { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 700; }
  .act svg { width: 15px; height: 15px; }
  .act.primary { background: var(--accent); color: var(--on-accent); }
  .act.danger { color: var(--danger); background: var(--danger-soft); }
  .act.icon-only { margin-left: auto; padding: 7px 9px; }
  .check { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
           border: 2px solid var(--line); color: transparent; transition: background .15s, border-color .15s; }
  .check svg { width: 16px; height: 16px; stroke-width: 3; }
  .card.done .check { border-color: var(--cat, var(--accent)); background: var(--cat, var(--accent)); color: #fff; }
  .card.done h3 { color: var(--muted); text-decoration: line-through; }
  .card.pending { background: var(--accent-soft); box-shadow: none; }

  .empty { padding: 28px 20px; border: 2px dashed var(--line); border-radius: var(--r-lg); text-align: center; color: var(--muted); }
  .empty b { display: block; margin-bottom: 4px; font-size: 16px; color: var(--text); }
  .empty p { margin: 0; font-size: 14px; }
  .fatal { margin: 30vh 24px 0; text-align: center; color: var(--muted); }

  /* ── Нижние листы ── */
  .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(10, 8, 30, .45);
           opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .panel { width: 100%; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
           padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: var(--r-xl) var(--r-xl) 0 0;
           background: var(--bg); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .panel.tall { height: 92vh; }
  .sheet.open .panel { transform: none; }
  .grip { width: 40px; height: 5px; margin: 0 auto 10px; border-radius: 3px; background: var(--line); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .sheet-head h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .close { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--muted); }
  .label { margin: 18px 4px 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .hint { margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
  .input { position: relative; display: block; margin-bottom: 10px; padding: 10px 14px; border: 1.5px solid transparent;
           border-radius: var(--r-md); background: var(--surface); transition: border-color .15s; }
  .input:focus-within { border-color: var(--accent); }
  .input > span { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .input input, .input textarea, .input select { display: block; width: 100%; min-height: 24px; padding: 0; border: 0; outline: 0;
           background: none; color: var(--text); font-weight: 600; resize: none; -webkit-appearance: none; appearance: none; }
  .input textarea { font-weight: 500; }
  .input.select::after { content: ""; position: absolute; right: 16px; bottom: 16px; width: 7px; height: 7px;
                         border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2.single { grid-template-columns: 1fr; }
  .switch { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 12px 14px;
            border-radius: var(--r-md); background: var(--surface); font-weight: 600; }
  .switch input { position: relative; flex: none; width: 46px; height: 28px; margin: 0; border-radius: 999px; background: var(--line);
                  -webkit-appearance: none; appearance: none; cursor: pointer; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
                         background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(18px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 13px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; transition: background .15s, color .15s; }
  .chip.on { background: var(--accent); color: var(--on-accent); }
  .chip.cat.on { background: var(--cat); color: #fff; }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--surface); }
  .seg button { padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .seg button.on.high { background: var(--danger); }
  .custom, .sub-add { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 8px 8px 14px; border-radius: var(--r-md); background: var(--surface); }
  .custom > span { flex: 1; font-size: 14px; font-weight: 600; color: var(--muted); }
  .custom input, .custom select { height: 34px; padding: 0 8px; border: 0; border-radius: 10px; outline: 0; background: var(--surface-2); font-weight: 700; }
  .custom input { width: 56px; text-align: center; }
  .sub-add input { flex: 1; min-width: 0; height: 34px; border: 0; outline: 0; background: none; font-weight: 600; }
  .plus { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  .sub-list { display: grid; gap: 6px; }
  .sub-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 14px; border-radius: var(--r-md); background: var(--surface); }
  .sub-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .sub-row button { display: grid; place-items: center; width: 30px; height: 30px; color: var(--muted); }
  .box { padding: 16px; border-radius: var(--r-md); background: var(--surface); }
  .box p { margin: 0; font-size: 14px; color: var(--muted); }
  .cal-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .cal-btns button { padding: 11px 6px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .primary-btn, .danger-btn { display: block; width: 100%; height: 52px; margin-top: 20px; border-radius: 16px; font-size: 16px; font-weight: 800; }
  .primary-btn { background: linear-gradient(150deg, var(--hero-from), var(--hero-to)); color: #fff; }
  .primary-btn:active { opacity: .85; }
  .primary-btn:disabled { opacity: .5; }
  .danger-btn { margin-top: 10px; background: var(--danger-soft); color: var(--danger); }

  /* Поиск */
  .search-box { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 0 14px; height: 48px;
                border: 1.5px solid var(--accent); border-radius: var(--r-md); background: var(--surface); }
  .search-box > span { display: grid; color: var(--muted); }
  .search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-weight: 600; }

  /* План дня */
  .plan-row { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); }
  .plan-row b { flex: none; font-variant-numeric: tabular-nums; }
  .plan-comment { margin: 14px 4px 0; color: var(--muted); }
  .loading { padding: 40px 0; text-align: center; color: var(--muted); }

  /* Тост «Отменить» */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30;
           display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 16px;
           background: #17162e; color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
           transform: translateY(150%); visibility: hidden; transition: transform .25s cubic-bezier(.2, .8, .2, 1), visibility .25s; }
  .toast.show { transform: none; visibility: visible; }
  .toast span { flex: 1; font-weight: 600; }
  .toast button { padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, .14); color: #c9bfff; font-weight: 800; }

  /* Знакомство */
  .onboard { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
             background: linear-gradient(160deg, var(--hero-from), var(--hero-to)); color: #fff; }
  .onboard-skip { align-self: flex-end; padding: 8px 4px; color: rgba(255, 255, 255, .8); font-weight: 700; }
  .slide { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .slide-icon { display: grid; place-items: center; width: 112px; height: 112px; margin: 0 auto 28px; border-radius: 32px; background: rgba(255, 255, 255, .16); }
  .slide-icon svg { width: 56px; height: 56px; stroke-width: 1.6; }
  .slide h2 { margin: 0 0 12px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .slide p { margin: 0 auto; max-width: 340px; font-size: 16px; line-height: 1.5; opacity: .9; }
  .onboard-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .onboard-dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .35); transition: width .2s; }
  .onboard-dots i.on { width: 24px; background: #fff; }
  .onboard-next { height: 54px; border-radius: 16px; background: #fff; color: var(--hero-from); font-size: 16px; font-weight: 800; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <div class="eyebrow" data-t="my_tasks"></div>
    <div class="nav">
      <button class="hbtn" id="search-btn" data-icon="search" data-aria="search_aria"></button>
      <button class="hbtn" id="gear" data-icon="gear" data-aria="settings_aria"></button>
    </div>
  </div>
  <div class="hero-month">
    <h1 id="month"></h1>
    <div class="nav">
      <button class="hbtn" id="to-today" data-t="today"></button>
      <button class="hbtn" id="prev" data-icon="left" data-aria="prev"></button>
      <button class="hbtn" id="next" data-icon="right" data-aria="next"></button>
    </div>
  </div>
  <div class="weekdays" id="weekdays"></div>
  <div class="grid" id="grid"></div>
</header>

<main id="main">
  <section class="week" id="week" hidden>
    <div class="week-top"><b data-t="this_week"></b><span id="week-sum"></span></div>
    <div class="bar"><i id="week-bar"></i></div>
    <div class="week-cats" id="week-cats"></div>
  </section>
  <section id="inbox" hidden>
    <div class="sec-head"><h2 data-t="need_confirm"></h2><span class="badge" id="inbox-count"></span></div>
    <div class="stack" id="inbox-list"></div>
  </section>
  <section>
    <div class="sec-head">
      <div><h2 id="day-title"></h2><p id="day-sub"></p></div>
      <div class="head-actions">
        <button class="soft-btn" id="plan-btn" hidden></button>
        <button class="soft-btn" id="add"></button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="stack" id="day-list"></div>
  </section>
</main>

<div class="sheet" id="editor">
  <div class="panel">
    <div class="grip"></div>
    <div class="sheet-head"><h3 id="ed-heading"></h3><button class="close" data-close data-icon="close" data-aria="close"></button></div>
    <label class="input"><span data-t="f_title"></span><input id="f-title" maxlength="100" data-ph="f_title_ph"></label>
    <label class="input"><span data-t="f_desc"></span><textarea id="f-desc" rows="3" maxlength="500" data-ph="f_desc_ph"></textarea></label>
    <label class="input"><span data-t="f_loc"></span><input id="f-loc" maxlength="100" data-ph="optional"></label>
    <label class="switch"><span data-t="all_day_switch"></span><input type="checkbox" id="f-allday"></label>
    <div class="row2" id="f-when">
      <label class="input"><span data-t="date"></span><input type="date" id="f-date"></label>
      <label class="input" id="f-time-box"><span data-t="time"></span><input type="time" id="f-time"></label>
    </div>
    <div class="label" data-t="category"></div>
    <div class="chips" id="f-cats"></div>
    <div class="label" data-t="priority"></div>
    <div class="seg" id="f-prio"></div>
    <div class="label" data-t="subtasks"></div>
    <div class="sub-list" id="f-subs"></div>
    <div class="sub-add"><input id="f-sub-input" maxlength="100" data-ph="sub_ph"><button class="plus" id="f-sub-add" data-icon="plus" data-aria="add"></button></div>
    <label class="input select" style="margin-top: 18px"><span data-t="repeat"></span><select id="f-repeat"></select></label>
    <p class="hint" id="f-repeat-hint" data-t="repeat_hint" hidden></p>
    <div class="label" data-t="remind"></div>
    <div id="f-reminders"></div>
    <button class="primary-btn" id="f-save" data-t="save"></button>
    <button class="danger-btn" id="f-delete" data-t="delete_task"></button>
  </div>
</div>

<div class="sheet" id="settings">
  <div class="panel">
    <div class="grip"></div>
    <div class="sheet-head"><h3 data-t="settings"></h3><button class="close" data-close data-icon="close" data-aria="close"></button></div>

const svg = name => `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;  // только свои статичные иконки
const CATS = ["work", "personal", "shopping", "health", "study", "other"];
const CAT_ICON = { work: "💼", personal: "🏠", shopping: "🛒", health: "🩺", study: "📚", other: "📌" };
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;  // только textContent: тексты задач приходят из чужих сообщений
  return e;
};
const withIcon = (tag, cls, icon, text) => {
  const e = el(tag, cls);
  e.innerHTML = svg(icon);
  if (text != null) e.append(el("span", "", text));
  return e;
};
const catStyle = (node, cat) => node.style.setProperty("--cat", `var(--c-${CATS.includes(cat) ? cat : "other"})`);
const haptic = (kind = "light") => tg.HapticFeedback?.impactOccurred(kind);
const tick = () => tg.HapticFeedback?.selectionChanged();
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const shift = (d, days) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + days);
const asDate = day => new Date(day + "T00:00");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const TODAY = iso(new Date()), TOMORROW = iso(shift(new Date(), 1));
const fmt = opts => new Intl.DateTimeFormat(lang, opts);
const dayName = day => day === TODAY ? tr("today") : day === TOMORROW ? tr("tomorrow") : cap(fmt({ weekday: "short", day: "numeric", month: "short" }).format(asDate(day)));
const when = t => dayName(t.start.slice(0, 10)) + (t.start[10] ? ", " + t.start.slice(11, 16) : "");

// Напоминания — минуты до начала. Подписи совпадают с texts.offset_label.
const PRESETS = [0, 5, 15, 30, 60, 120, 1440, 2880, 10080];
const MAX_OFFSET = 30 * 1440, MAX_REMINDERS = 10, MAX_SUBTASKS = 20;
function offsetLabel(m) {
  const U = { ru: ["ч", "мин"], en: ["h", "min"], ky: ["саат", "мүнөт"] }[lang];
  if (m === 0) return { ru: "в момент начала", en: "at start", ky: "башталганда" }[lang];
  if (m === 10080) return { ru: "за неделю", en: "1 week before", ky: "1 жума калганда" }[lang];
  const span = m % 1440 === 0 ? (lang === "ru" && m === 1440 ? "день" : count(m / 1440, "day"))
    : [Math.floor(m / 60) && `${Math.floor(m / 60)} ${U[0]}`, m % 60 && `${m % 60} ${U[1]}`].filter(Boolean).join(" ");
  return { ru: `за ${span}`, en: `${span} before`, ky: `${span} калганда` }[lang];
}

/* ── Состояние ─────────────────────────────────────── */
let view = new Date(new Date().getFullYear(), new Date().getMonth(), 1);  // первый день показанного месяца
let selected = TODAY, filter = "all";
let tasks = [], settings = { reminders: [60], digest_hour: 9, evening_hour: 21, smart_reminders: true, lang }, calendar = {}, week = null;
let editing = null, current = null, planItems = [];
const editReminders = new Set(), defaultReminders = new Set();
let editSubs = [], editCat = "other", editPrio = "normal";

function applyTheme() {
  document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
  const css = getComputedStyle(document.documentElement);
  try {
    tg.setHeaderColor(css.getPropertyValue("--hero-from").trim());
    tg.setBackgroundColor(css.getPropertyValue("--bg").trim());
  } catch {}
}

function hourSelect(select, from, to) {
  const value = select.value;
  select.replaceChildren(Object.assign(el("option", "", tr("no_send")), { value: "" }));
  for (let h = from; h <= to; h++) select.append(Object.assign(el("option", "", tr("every_day", { h })), { value: h }));
  select.value = value;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = tr(n.dataset.t); });
  document.querySelectorAll("[data-ph]").forEach(n => { n.placeholder = tr(n.dataset.ph); });
  document.querySelectorAll("[data-aria]").forEach(n => n.setAttribute("aria-label", tr(n.dataset.aria)));
  const wd = fmt({ weekday: "short" });
  $("#weekdays").replaceChildren(...[0, 1, 2, 3, 4, 5, 6].map(i => el("span", "", wd.format(new Date(2024, 0, 1 + i)))));  // 1.01.2024 — понедельник
  $("#add").innerHTML = svg("plus");
  $("#add").append(tr("task_btn"));
  $("#plan-btn").innerHTML = svg("sparkles");
  $("#plan-btn").append(tr("plan_btn"));
  $("#f-repeat").replaceChildren(...Object.entries(L[lang].rep).map(([k, v]) => Object.assign(el("option", "", v), { value: k })));
  hourSelect($("#s-digest"), 5, 12);
  hourSelect($("#s-evening"), 17, 23);
}

/* ── API ───────────────────────────────────────────── */
async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: tg.initData, "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function gridInfo() {
  const y = view.getFullYear(), m = view.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;  // неделя с понедельника
  const days = new Date(y, m + 1, 0).getDate();
  return { start: new Date(y, m, 1 - lead), count: Math.ceil((lead + days) / 7) * 7 };
}

async function load() {
  const { start, count: n } = gridInfo();
  ({ tasks, settings, calendar, week } = await api(`api/tasks?from=${iso(start)}&to=${iso(shift(start, n))}`));
  if (settings.lang !== lang) { lang = settings.lang; applyLang(); }
  render();
}

async function save(path, body) {
  try { return await api(path, body); }
  catch { tg.showAlert(tr("save_failed")); return null; }
  finally { await load().catch(() => {}); }
}
const update = (t, body) => save(`api/tasks/${t.id}`, body);

/* ── Календарь ─────────────────────────────────────── */
function goMonth(delta) {
  tick();
  view = new Date(view.getFullYear(), view.getMonth() + delta, 1);
  const now = new Date();
  selected = view.getMonth() === now.getMonth() && view.getFullYear() === now.getFullYear() ? TODAY : iso(view);
  load();
}

function select(day) {
  tick();
  const d = asDate(day);
  selected = day;
  filter = "all";
  if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) {
    view = new Date(d.getFullYear(), d.getMonth(), 1);
    load();
  } else render();
}

function renderCalendar(ok) {
  const title = $("#month");
  title.textContent = cap(fmt({ month: "long" }).format(view)) + " ";
  title.append(el("span", "", view.getFullYear()));
  $("#to-today").hidden = selected === TODAY;
  const byDay = {};
  for (const t of ok) (byDay[t.start.slice(0, 10)] ??= []).push(t);
  const { start, count: n } = gridInfo();
  const full = fmt({ weekday: "long", day: "numeric", month: "long" });
  const grid = $("#grid");
  grid.replaceChildren();
  for (let i = 0; i < n; i++) {
    const d = shift(start, i), key = iso(d);
    const cls = ["cell"];
    if (d.getMonth() !== view.getMonth()) cls.push("out");
    if (i % 7 > 4) cls.push("weekend");
    if (key === TODAY) cls.push("today");
    if (key === selected) cls.push("sel");
    const cell = el("button", cls.join(" "));
    cell.append(el("span", "num", d.getDate()));
    const dots = el("span", "dots");
    for (const t of (byDay[key] || []).slice(0, 3)) dots.append(el("i", t.done ? "done" : ""));
    cell.append(dots);
    cell.setAttribute("aria-label", cap(full.format(d)) + (byDay[key] ? `, ${count(byDay[key].length, "task")}` : ""));
    cell.onclick = () => select(key);
    grid.append(cell);
  }
}

function renderWeek() {
  $("#week").hidden = !week;
  if (!week) return;
  const pct = week.total ? Math.round(100 * week.done / week.total) : 0;
  $("#week-sum").textContent = week.total ? `${tr("week_sum", { d: week.done, t: week.total })} · ${pct}%` : tr("week_empty");
  $("#week-bar").style.width = pct + "%";
  const cats = $("#week-cats");
  cats.replaceChildren();
  if (week.ai) cats.append(el("span", "tag", tr("ai_found", { n: week.ai })));
  for (const [c, [d, n]] of Object.entries(week.by_category).sort((a, b) => b[1][1] - a[1][1])) {
    const tag = el("span", "tag cat", `${CAT_ICON[c] || "📌"} ${L[lang].cat[c] || c} ${d}/${n}`);
    catStyle(tag, c);
    cats.append(tag);
  }
}

/* ── Карточки ──────────────────────────────────────── */
function tags(t, { withDate = false, clash = null } = {}) {
  const box = el("div", "tags");
  const add = (icon, text, cls = "") => box.append(withIcon("span", "tag " + cls, icon, text));
  const cat = el("span", "tag cat", `${CAT_ICON[t.category] || "📌"} ${L[lang].cat[t.category] || ""}`);
  catStyle(cat, t.category);
  box.append(cat);
  if (t.priority === "high") box.append(el("span", "tag hot", L[lang].prio.high));
  if (clash) add("alert", tr("clash", { t: clash }), "warn");
  if (withDate) add("calendar", when(t));
  if (t.location) add("pin", t.location);
  if (t.reminders.length && !t.done && t.status === "ok")
    add("bell", t.reminders.length === 1 ? offsetLabel(t.reminders[0]) : count(t.reminders.length, "rem"));
  if (t.repeat) add("repeat", L[lang].rep[t.repeat].toLowerCase());
  if (t.source) add("chat", t.source);
  return box;
}

function subtaskList(t, interactive) {
  const box = el("div", "subs");
  t.subtasks.forEach((s, i) => {
    const row = el(interactive ? "button" : "div", "sub" + (s.done ? " done" : ""));
    const mark = el("i");
    mark.innerHTML = svg("check");
    row.append(mark, el("span", "", s.text));
    if (interactive) row.onclick = () => {
      tick();
      row.classList.toggle("done");
      update(t, { subtasks: t.subtasks.map((x, j) => j === i ? { ...x, done: !x.done } : x) });
    };
    box.append(row);
  });
  return box;
}

function taskCard(t, opts = {}) {
  const card = el("article", "card" + (t.done ? " done" : ""));
  catStyle(card, t.category);
  const whenBox = el("div", "when");
  whenBox.append(el("b", "", t.start.slice(11, 16) || tr("all_a")), el("small", "", t.start[10] ? "" : tr("all_b")));
  const content = el("div", "content");
  content.append(el("h3", "", t.title));
  if (t.description) content.append(el("p", "desc", t.description));
  if (t.subtasks.length) content.append(subtaskList(t, true));
  content.append(tags(t, opts));
  const actions = el("div", "card-actions");
  const edit = withIcon("button", "act", "edit", tr("edit"));
  const del = withIcon("button", "act danger", "trash", tr("delete"));
  edit.onclick = () => openEditor(t);
  del.onclick = () => confirmDelete(t);
  actions.append(edit, del);
  content.append(actions);
  const check = withIcon("button", "check", "check");
  check.setAttribute("aria-label", tr("mark_done"));
  check.onclick = () => { haptic(); card.classList.toggle("done"); update(t, { done: !t.done }); };
  card.append(whenBox, content, check);
  if (opts.onOpen) content.onclick = e => { if (!e.target.closest("button")) opts.onOpen(); };
  return card;
}

function pendingCard(t) {
  const card = el("article", "card pending");
  catStyle(card, t.category);
  const content = el("div", "content");
  content.append(el("h3", "", t.title));
  if (t.description) content.append(el("p", "desc", t.description));
  if (t.subtasks.length) content.append(subtaskList(t, false));
  content.append(tags(t, { withDate: true }));
  const actions = el("div", "card-actions");
  const yes = withIcon("button", "act primary", "check", tr("add"));
  const edit = withIcon("button", "act", "edit", tr("edit"));
  const no = withIcon("button", "act danger icon-only", "close");
  no.setAttribute("aria-label", tr("reject"));
  yes.onclick = () => { tg.HapticFeedback?.notificationOccurred("success"); update(t, { confirm: true }); };
  edit.onclick = () => openEditor(t);
  no.onclick = () => { haptic(); removeTask(t, true); };
  actions.append(yes, edit, no);
  content.append(actions);
  card.append(content);
  return card;
}

function render() {
  const ok = tasks.filter(t => t.status === "ok");
  const pending = tasks.filter(t => t.status === "pending");
  renderCalendar(ok);
  renderWeek();
  $("#inbox").hidden = !pending.length;
  $("#inbox-count").textContent = pending.length;
  $("#inbox-list").replaceChildren(...pending.map(pendingCard));

  const day = ok.filter(t => t.start.slice(0, 10) === selected);
  const done = day.filter(t => t.done).length;
  const d = asDate(selected);
  const rel = selected === TODAY ? tr("today") : selected === TOMORROW ? tr("tomorrow") : "";
  $("#day-title").textContent = rel ? `${rel}, ${fmt({ day: "numeric", month: "long" }).format(d)}` : cap(fmt({ weekday: "long", day: "numeric", month: "long" }).format(d));
  $("#day-sub").textContent = [rel && cap(fmt({ weekday: "long" }).format(d)),
    day.length && count(day.length, "task") + (done ? `, ${tr("done_n", { n: done })}` : "")].filter(Boolean).join(" · ");
  $("#plan-btn").hidden = selected < TODAY || !day.some(t => !t.start[10] && !t.done);

  // Фильтр по категориям — когда в дне их больше одной.
  const cats = [...new Set(day.map(t => t.category))];
  if (!cats.includes(filter)) filter = "all";
  const filters = $("#filters");
  filters.hidden = cats.length < 2;
  filters.replaceChildren(...["all", ...cats].map(c => {
    const b = el("button", "filter" + (filter === c ? " on" : ""), c === "all" ? tr("all") : `${CAT_ICON[c] || "📌"} ${L[lang].cat[c] || c}`);
    b.onclick = () => { tick(); filter = c; render(); };
    return b;
  }));

  const shown = day.filter(t => filter === "all" || t.category === filter);
  const minutes = t => +t.start.slice(11, 13) * 60 + +t.start.slice(14, 16);
  const clashWith = t => (t.start[10] && !t.done && day.find(o => o !== t && o.start[10] && !o.done && Math.abs(minutes(o) - minutes(t)) < 60)) || null;
  const list = $("#day-list");
  list.replaceChildren(...shown.map(t => taskCard(t, { clash: clashWith(t)?.start.slice(11, 16) })));
  if (!day.length) {
    const e = el("div", "empty");
    e.append(el("b", "", tr(selected < TODAY ? "empty_past" : "empty")), el("p", "", tr("empty_text")));
    list.append(e);
  }
}

/* ── Выбор напоминаний ─────────────────────────────── */
function reminderPicker(box, set, onChange) {
  box.replaceChildren();
  const chips = el("div", "chips");
  for (const m of [...new Set([...PRESETS, ...set])].sort((a, b) => a - b)) {
    const c = el("button", "chip" + (set.has(m) ? " on" : ""), offsetLabel(m));
    c.onclick = () => {
      tick();
      if (set.has(m)) set.delete(m);
      else if (set.size < MAX_REMINDERS) set.add(m);
      else return tg.showAlert(tr("max_rem", { n: MAX_REMINDERS }));
      reminderPicker(box, set, onChange);
      onChange?.();
    };
    chips.append(c);
  }
  const custom = el("div", "custom");
  const num = Object.assign(el("input"), { type: "number", inputMode: "numeric", min: 1, value: 3 });
  const unit = el("select");
  for (const [key, k] of [["u_min", 1], ["u_h", 60], ["u_d", 1440]]) unit.append(Object.assign(el("option", "", tr(key)), { value: k }));
  unit.value = 60;
  const add = withIcon("button", "plus", "plus");
  add.setAttribute("aria-label", tr("add"));
  add.onclick = () => {
    const m = Math.round(+num.value * +unit.value);
    if (!(m > 0 && m <= MAX_OFFSET)) return tg.showAlert(tr("rem_range"));
    if (set.size >= MAX_REMINDERS) return tg.showAlert(tr("max_rem", { n: MAX_REMINDERS }));
    haptic();
    set.add(m);
    reminderPicker(box, set, onChange);
    onChange?.();
  };
  custom.append(el("span", "", tr("custom")), num, unit, add);
  box.append(chips, custom);
}

/* ── Листы ─────────────────────────────────────────── */
function showSheet(sheet) {
  if (current && current !== sheet) current.classList.remove("open");
  current = sheet;
  sheet.classList.add("open");
  tg.BackButton.show();
}

function hideSheet() {
  if (!current) return;
  document.activeElement?.blur();
  current.classList.remove("open");
  current = editing = null;
  tg.BackButton.hide();
}

function toggleAllDay() {
  const allDay = $("#f-allday").checked;
  $("#f-time-box").hidden = allDay;
  $("#f-when").classList.toggle("single", allDay);
}

function renderEditorBits() {
  $("#f-cats").replaceChildren(...CATS.map(c => {
    const b = el("button", "chip cat" + (editCat === c ? " on" : ""), `${CAT_ICON[c]} ${L[lang].cat[c]}`);
    catStyle(b, c);
    b.onclick = () => { tick(); editCat = c; renderEditorBits(); };
    return b;
  }));
  $("#f-prio").replaceChildren(...["high", "normal", "low"].map(p => {
    const b = el("button", (editPrio === p ? "on " : "") + p, L[lang].prio[p]);
    b.onclick = () => { tick(); editPrio = p; renderEditorBits(); };
    return b;
  }));
  $("#f-subs").replaceChildren(...editSubs.map((s, i) => {
    const row = el("div", "sub-row");
    const rm = withIcon("button", "", "close");
    rm.setAttribute("aria-label", tr("delete"));
    rm.onclick = () => { tick(); editSubs.splice(i, 1); renderEditorBits(); };
    row.append(el("span", "", s.text), rm);
    return row;
  }));
}

function addSubtask() {
  const input = $("#f-sub-input"), text = input.value.trim();
  if (!text || editSubs.length >= MAX_SUBTASKS) return;
  haptic();
  editSubs.push({ text, done: false });
  input.value = "";
  renderEditorBits();
}

function openEditor(t) {
  editing = t;  // null — новая задача
  $("#ed-heading").textContent = tr(t ? "task" : "new_task");
  $("#f-title").value = t?.title ?? "";
  $("#f-desc").value = t?.description ?? "";
  $("#f-loc").value = t?.location ?? "";
  $("#f-date").value = t ? t.start.slice(0, 10) : selected;
  $("#f-time").value = t?.start[10] ? t.start.slice(11, 16) : "10:00";
  $("#f-allday").checked = !!t && !t.start[10];
  toggleAllDay();
  $("#f-repeat").value = t?.repeat ?? "";
  $("#f-repeat-hint").hidden = !t?.series;
  $("#f-delete").hidden = !t;
  $("#f-sub-input").value = "";
  editCat = t?.category ?? (filter !== "all" ? filter : "other");
  editPrio = t?.priority ?? "normal";
  editSubs = (t?.subtasks ?? []).map(s => ({ ...s }));
  renderEditorBits();
  editReminders.clear();
  (t ? t.reminders : settings.reminders).forEach(m => editReminders.add(m));
  reminderPicker($("#f-reminders"), editReminders);
  showSheet($("#editor"));
  if (!t) setTimeout(() => $("#f-title").focus(), 300);
}

async function saveEditor() {
  addSubtask();  // недописанный пункт тоже сохраняем
  const title = $("#f-title").value.trim(), date = $("#f-date").value, time = $("#f-time").value;
  if (!title || !date) return tg.showAlert(tr("need_title"));
  const start = $("#f-allday").checked || !time ? date : `${date}T${time}`;
  const body = { title, start, description: $("#f-desc").value.trim(), location: $("#f-loc").value.trim(),
                 reminders: [...editReminders], repeat: $("#f-repeat").value, category: editCat, priority: editPrio, subtasks: editSubs };
  const t = editing;
  hideSheet();
  selected = date;
  view = new Date(asDate(date).getFullYear(), asDate(date).getMonth(), 1);
  if (await save(t ? `api/tasks/${t.id}` : "api/tasks", body)) tg.HapticFeedback?.notificationOccurred("success");
}

/* ── Удаление и «Отменить» ─────────────────────────── */
let toastTimer = null, undoBatch = null;
function toast(text, batch) {
  undoBatch = batch;
  $("#toast-text").textContent = text;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 5000);
}
$("#toast-undo").onclick = async () => {
  $("#toast").classList.remove("show");
  if (!undoBatch) return;
  haptic();
  const batch = undoBatch;
  undoBatch = null;
  await save("api/undo", { batch });
};

async function removeTask(t, how) {
  hideSheet();
  const res = await save(`api/tasks/${t.id}`, { delete: how });
  if (res?.undo) toast(tr(how === "series" ? "deleted_series" : "deleted"), res.undo);
}

function confirmDelete(t) {
  if (!t.series) return tg.showConfirm(tr("delete_q", { t: t.title }), yes => { if (yes) { haptic("medium"); removeTask(t, true); } });
  tg.showPopup({
    title: tr("series_title"),
    message: tr("delete_q", { t: t.title }),
    buttons: [{ id: "one", type: "default", text: tr("only_this") }, { id: "series", type: "destructive", text: tr("this_and_next") }, { type: "cancel" }],
  }, id => { if (id === "one" || id === "series") { haptic("medium"); removeTask(t, id === "series" ? "series" : true); } });
}

/* ── Поиск ─────────────────────────────────────────── */
let searchTimer = null;
function openSearch() {
  $("#q").value = "";
  $("#results").replaceChildren(el("p", "loading", tr("type_more")));
  showSheet($("#search"));
  setTimeout(() => $("#q").focus(), 300);
}
$("#q").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("#q").value.trim(), box = $("#results");
    if (q.length < 2) return box.replaceChildren(el("p", "loading", tr("type_more")));
    try {
      const { tasks: found } = await api(`api/search?q=${encodeURIComponent(q)}`);
      box.replaceChildren(...found.map(t => t.status === "pending" ? pendingCard(t)
        : taskCard(t, { withDate: true, onOpen: () => { hideSheet(); select(t.start.slice(0, 10)); } })));
      if (!found.length) box.append(el("p", "loading", tr("nothing")));
    } catch { box.replaceChildren(el("p", "loading", tr("save_failed"))); }
  }, 250);
};

/* ── План дня ──────────────────────────────────────── */
async function openPlanner() {
  haptic();
  planItems = [];
  $("#plan-list").replaceChildren(el("p", "loading", tr("planning")));
  $("#plan-comment").textContent = "";
  $("#plan-apply").disabled = true;
  showSheet($("#planner"));
  try {
    const { items, comment } = await api("api/plan", { date: selected });
    planItems = items;
    if (!items.length) return $("#plan-list").replaceChildren(el("p", "loading", tr("plan_nothing")));
    $("#plan-list").replaceChildren(...items.map(i => {
      const row = el("div", "plan-row");
      const start = new Date(i.start), end = new Date(start.getTime() + i.minutes * 60000);
      row.append(el("b", "", `${pad(start.getHours())}:${pad(start.getMinutes())}–${pad(end.getHours())}:${pad(end.getMinutes())}`), el("span", "", i.title));
      return row;
    }));
    $("#plan-comment").textContent = comment;
    $("#plan-apply").disabled = false;
  } catch { $("#plan-list").replaceChildren(el("p", "loading", tr("plan_failed"))); }
}
$("#plan-apply").onclick = async () => {
  hideSheet();
  if (await save("api/plan/apply", { items: planItems.map(i => ({ id: i.id, start: i.start })) }))
    tg.HapticFeedback?.notificationOccurred("success");
};

/* ── Настройки ─────────────────────────────────────── */
function openSettings() {
  defaultReminders.clear();
  settings.reminders.forEach(m => defaultReminders.add(m));
  reminderPicker($("#s-reminders"), defaultReminders, () => saveSettings({ reminders: [...defaultReminders] }));
  $("#s-digest").value = settings.digest_hour ?? "";
  $("#s-evening").value = settings.evening_hour ?? "";
  $("#s-smart").checked = settings.smart_reminders;
  $("#s-lang").value = lang;
  showSheet($("#settings"));
}

async function saveSettings(body) {
  try { await api("api/settings", body); Object.assign(settings, body); }
  catch { tg.showAlert(tr("save_failed")); }
}

$("#s-digest").onchange = e => saveSettings({ digest_hour: e.target.value === "" ? null : +e.target.value });
$("#s-evening").onchange = e => saveSettings({ evening_hour: e.target.value === "" ? null : +e.target.value });
$("#s-smart").onchange = e => saveSettings({ smart_reminders: e.target.checked });
$("#s-lang").onchange = async e => {
  lang = e.target.value;
  await saveSettings({ lang });
  applyLang();
  render();
  openSettings();
};

/* ── Знакомство ────────────────────────────────────── */
const SLIDE_ICONS = ["message", "calendar", "sparkles"];
let slide = 0;
function renderSlide() {
  const [title, text] = L[lang].slides[slide];
  $("#slide-icon").innerHTML = svg(SLIDE_ICONS[slide]);
  $("#slide-title").textContent = title;
  $("#slide-text").textContent = text;
  [...$("#onboard-dots").children].forEach((d, i) => d.classList.toggle("on", i === slide));
  $("#onboard-next").textContent = tr(slide === 2 ? "start" : "next_btn");
}
function finishOnboarding() {
  tick();
  $("#onboard").hidden = true;
  try { tg.CloudStorage.setItem("onboarded", "1"); } catch {}
  try { localStorage.setItem("onboarded", "1"); } catch {}
}
$("#onboard-next").onclick = () => { if (slide === 2) return finishOnboarding(); tick(); slide++; renderSlide(); };
$("#onboard-skip").onclick = finishOnboarding;
function maybeOnboard() {
  const show = () => { slide = 0; renderSlide(); $("#onboard").hidden = false; };
  try { if (localStorage.getItem("onboarded")) return; } catch {}
  try { tg.CloudStorage.getItem("onboarded", (err, value) => { if (err || !value) show(); }); } catch { show(); }
}

/* ── Обработчики ───────────────────────────────────── */
document.querySelectorAll("[data-icon]").forEach(n => { n.innerHTML = svg(n.dataset.icon); });
document.querySelectorAll("[data-close]").forEach(b => b.onclick = hideSheet);
document.querySelectorAll(".sheet").forEach(s => s.addEventListener("click", e => { if (e.target === s) hideSheet(); }));
$("#prev").onclick = () => goMonth(-1);
$("#next").onclick = () => goMonth(1);
$("#to-today").onclick = () => select(TODAY);
$("#gear").onclick = openSettings;
$("#search-btn").onclick = openSearch;
$("#add").onclick = () => openEditor(null);
$("#plan-btn").onclick = openPlanner;
$("#f-allday").onchange = toggleAllDay;
$("#f-save").onclick = saveEditor;
$("#f-delete").onclick = () => editing && confirmDelete(editing);
$("#f-sub-add").onclick = addSubtask;
$("#f-sub-input").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addSubtask(); } };

let touchX = null;  // свайп по календарю листает месяцы
$("#grid").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("#grid").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) goMonth(dx < 0 ? 1 : -1);
});

document.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => {
  const kind = b.dataset.cal;
  if (kind !== "url") return tg.openLink(calendar[kind]);
  navigator.clipboard.writeText(calendar.url).then(() => tg.showAlert(tr("copied"))).catch(() => tg.showAlert(calendar.url));
});

tg.BackButton.onClick(hideSheet);
tg.SettingsButton?.show();
tg.SettingsButton?.onClick(() => { hideSheet(); openSettings(); });
tg.onEvent("themeChanged", applyTheme);
applyTheme();
applyLang();

// Ссылки из бота: ?task=ID&date=YYYY-MM-DD — открыть задачу, ?view=settings — настройки.
const params = new URLSearchParams(location.search);
if (params.get("date")) {
  selected = params.get("date");
  view = new Date(asDate(selected).getFullYear(), asDate(selected).getMonth(), 1);
}
load()
  .then(() => {
    const t = tasks.find(t => t.id === +params.get("task"));
    if (t) openEditor(t);
    else if (params.get("view") === "settings") openSettings();
    else maybeOnboard();
  })
  .catch(() => {
    document.body.replaceChildren();
    const e = el("div", "fatal");
    e.append(el("b", "", tr("fatal")), el("p", "", tr("fatal_text")));
    document.body.append(e);
  });
</script>
</body>
</html>
